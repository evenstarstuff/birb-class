name: Chestnut-sided Warbler
section: Warblers
identification: "A yellow cap, black triangle under the eyes, streaked black and yellow back and chestnut coloured sides. In the fall (non-breeding) the yellow will look more green and they lose the black triangles under the eyes and develop white eyerings."
song: " A fast trill that goes down at the end."
cheats: "Wearing a construction hat. Actually looks chestnut."
